name: Security and QA regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/security-and-qa-hardening
      - fix/purchase-reliability-and-token-storage

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install lockfile-pinned dependencies (without lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run non-destructive regression tests
        run: npm run test:security
      - name: Build and type-check backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run build
