name: Zod 4 migration validation
on:
  push:
    branches:
      - fix/zod4-security-migration-20261026
permissions:
  contents: write
jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Zod 4 and refresh lockfile
        run: npm install zod@^4.6.7 --package-lock-only --no-fund
      - name: Install project and validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          npm ci --include=dev --ignore-scripts --no-fund
          npm run test:security
          npm run build
          npm audit --omit=dev
      - name: Commit dependency manifests after all checks pass
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: upgrade Zod to patched v4 after validation"
            git push origin HEAD:fix/zod4-security-migration-20261026
          fi
